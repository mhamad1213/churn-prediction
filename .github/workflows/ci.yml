# Runs on every push and pull request: rebuild the model from scratch, then lint and test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch: much smaller than the default GPU build
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Download the data
        run: python scripts/download_data.py

      - name: Train the models (baseline -> tuned -> threshold)
        env:
          PYTHONPATH: src
        run: |
          python -m churn.train_baseline
          python -m churn.tune
          python -m churn.threshold

      - name: Run the tests
        run: python -m pytest -v


  docker:
    needs: test          # only runs if the tests passed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t churn-api .
      - name: Start the container
        run: docker run -d --name churn -p 8000:8000 churn-api
      - name: Smoke test (health + one prediction)
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"gender":"Female","SeniorCitizen":"No","Partner":"No","Dependents":"No","tenure":3,"PhoneService":"Yes","MultipleLines":"No","InternetService":"Fiber optic","OnlineSecurity":"No","OnlineBackup":"No","DeviceProtection":"No","TechSupport":"No","StreamingTV":"Yes","StreamingMovies":"No","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":85.0,"TotalCharges":255.0}'
      - name: Show container logs if anything failed
        if: failure()
        run: docker logs churn